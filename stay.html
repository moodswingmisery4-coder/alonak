<!doctype html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>جزئیات اقامتگاه | مکانک</title><script src="https://cdn.tailwindcss.com"></script><script>tailwind.config={theme:{extend:{fontFamily:{sans:['Vazirmatn','Tahoma']},colors:{ink:'#182338',coral:'#ff5c5c',sand:'#fff8f3'}}}}</script><link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"><style>body{font-family:Vazirmatn,Tahoma,sans-serif;color:#182338}.toast{animation:in .25s}@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}</style><meta name="theme-color" content="#ffffff"><link rel="stylesheet" href="assets/theme.css?v=4"><script src="assets/theme.js"></script></head><body class="bg-white"><header class="border-b border-slate-100 sticky top-0 bg-white/95 backdrop-blur z-10"><nav class="max-w-7xl mx-auto px-5 lg:px-8 h-20 flex items-center justify-between"><a href="index.html" class="font-black text-2xl">مکانک<span class="text-coral">.</span></a><a href="index.html#stays" class="text-sm font-bold text-slate-600 hover:text-coral">بازگشت به اقامتگاه‌ها</a><button id="loginBtn" type="button" class="rounded-xl bg-coral text-white px-4 py-2 font-bold">ورود / ثبت‌نام</button></nav></header><main id="detail" class="max-w-7xl mx-auto px-5 lg:px-8 py-10"></main><div id="toast" class="fixed bottom-6 right-6 hidden bg-ink text-white px-5 py-4 rounded-2xl shadow-2xl text-sm"></div><div id="modal" class="fixed inset-0 z-50 hidden items-center justify-center p-5 bg-ink/60"><div class="bg-white rounded-3xl p-7 w-full max-w-md relative"></div></div><script src="assets/catalog.js?v=f792184"></script><script src="assets/auth.js?v=7"></script><script src="assets/booking.js?v=5"></script><script>const stays=window.MAKANAK_STAYS;const id=new URLSearchParams(location.search).get('id');const s=stays.find(x=>x.id===id)||stays[0],i=s.id;document.title=s.name+' | مکانک';const photos=Array.from(new Set((s.gallery||[s.img]).filter(Boolean)));document.querySelector('#detail').innerHTML=`<div class="grid lg:grid-cols-2 gap-10 items-start"><div><img id="mainPhoto" src="${photos[0]}" alt="${s.name}" class="w-full h-[420px] object-cover rounded-[2rem] shadow-lg"><div class="grid grid-cols-3 gap-3 mt-3">${photos.slice(1,4).map((photo,n)=>`<button type="button" class="gallery-thumb overflow-hidden rounded-2xl ${n===0?'ring-2 ring-coral':''}" data-photo="${photo}"><img src="${photo}" alt="${s.name} - تصویر ${n+2}" class="h-28 w-full object-cover rounded-2xl"></button>`).join('')}</div></div><div><span class="inline-block bg-orange-50 text-coral rounded-full px-4 py-2 text-sm font-bold mb-4">اطلاعات اقامتگاه</span><h1 class="text-3xl md:text-4xl font-black leading-relaxed">${s.name}</h1><p class="text-slate-500 mt-2">${s.city} · ★ ${s.rating}</p><p class="text-slate-600 leading-8 mt-8">${s.desc}</p><p class="my-6 text-sm text-slate-500">کد اقامتگاه ${s.sourceCode} · ظرفیت پایه اعلام‌شده: ${s.capacity||'نامشخص'} نفر</p><div class="border border-slate-200 rounded-3xl p-6 shadow-sm"><div class="flex items-center justify-between mb-5"><div><b class="text-xl">${s.price} تومان</b><span class="text-slate-400"> / هر شب</span></div><button id="favBtn" type="button" onclick="favorite()" class="fav-btn" aria-label="افزودن به علاقه‌مندی‌ها" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78L12 21.23l8.84-8.84a5.5 5.5 0 0 0 0-7.78Z"/></svg></button></div><div id="bookWidget" class="mt-1"></div></div></div></div><section class="mt-16 border-t pt-10"><h2 class="text-2xl font-black mb-4">قوانین اقامتگاه</h2><p class="text-slate-600 leading-8">قوانین ورود، خروج و لغو برای هر اقامتگاه متفاوت است؛ پیش از رزرو بررسی کنید.</p></section>`;document.querySelectorAll('.gallery-thumb').forEach(btn=>btn.onclick=()=>{document.querySelector('#mainPhoto').src=btn.dataset.photo;document.querySelectorAll('.gallery-thumb').forEach(x=>x.classList.remove('ring-2','ring-coral'));btn.classList.add('ring-2','ring-coral')});function toast(t){const e=document.querySelector('#toast');e.textContent=t;e.classList.remove('hidden');setTimeout(()=>e.classList.add('hidden'),2500)}function syncFavorite(){const btn=document.querySelector('#favBtn');if(!btn)return;let f=[];try{f=JSON.parse(localStorage.getItem('makanak_favorites')||'[]')}catch(e){}const on=Array.isArray(f)&&f.includes(i);btn.setAttribute('aria-pressed',String(on));btn.setAttribute('aria-label',on?'حذف از علاقه‌مندی‌ها':'افزودن به علاقه‌مندی‌ها')}function favorite(){let f=JSON.parse(localStorage.getItem('makanak_favorites')||'[]');f=f.includes(i)?f.filter(x=>x!==i):[...f,i];localStorage.setItem('makanak_favorites',JSON.stringify(f));syncFavorite();toast(f.includes(i)?'به علاقه‌مندی‌ها اضافه شد':'از علاقه‌مندی‌ها حذف شد')}const bookingWidget=window.MakanakBooking.mount(document.querySelector('#bookWidget'),{stayId:s.id,stayName:s.name,city:s.city,price:s.price,capacity:s.capacity||8});syncFavorite();</script></body></html>
