body{font-family:Vazirmatn,Tahoma,sans-serif;color:#182338}

/* ---------- panel ---------- */
.acct-wrap{display:grid;grid-template-columns:290px minmax(0,1fr);gap:22px;align-items:start}
.acct-wrap>*{min-width:0}
.acct-side{position:sticky;top:96px;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:16px;box-shadow:var(--shadow)}
.acct-user{display:flex;align-items:center;gap:12px;padding:4px 4px 14px;border-bottom:1px solid var(--line);margin-bottom:6px}
.acct-avatar{flex:0 0 46px;width:46px;height:46px;border-radius:16px;background:linear-gradient(135deg,#ff5c5c,#ff9a6b);color:#fff;display:grid;place-items:center;font-weight:900;font-size:18px}
.acct-user b{display:block;font-size:.95rem;line-height:1.6}
.acct-user p{font-size:.72rem;color:var(--muted);direction:ltr;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:170px}
.acct-nav{display:flex;flex-direction:column;gap:4px;min-width:0;max-width:100%}
.acct-menu{display:flex;flex-direction:column;gap:4px;min-width:0;max-width:100%}
.acct-toggle{display:none;align-items:center;justify-content:center;border:1px solid var(--line);background:var(--soft);color:var(--ink);border-radius:12px;cursor:pointer;padding:0}
.acct-toggle svg{width:20px;height:20px}
.acct-toggle .ic-close{display:none}
.acct-toggle[aria-expanded=true] .ic-open{display:none}
.acct-toggle[aria-expanded=true] .ic-close{display:block}
.acct-nav button{display:flex;align-items:center;gap:12px;width:100%;text-align:right;padding:11px 12px;border-radius:13px;font-size:.86rem;font-weight:700;color:var(--muted);background:transparent;border:1px solid transparent;cursor:pointer;transition:background .15s,color .15s,border-color .15s;font-family:inherit}
.acct-nav button svg{width:19px;height:19px;flex:0 0 19px;opacity:.85}
.acct-nav button:hover{background:var(--soft);color:var(--ink)}
.acct-nav button[aria-current=true]{background:var(--soft);color:var(--accent);border-color:var(--line)}
.acct-nav .acct-count{margin-inline-start:auto;font-size:.7rem;font-weight:800;background:var(--soft);color:var(--muted);border-radius:9px;padding:2px 7px}
.acct-nav button[aria-current=true] .acct-count{background:var(--accent);color:#fff}
.acct-logout{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:12px;padding:11px;border-radius:13px;border:1px solid #fecaca;background:#fef2f2;color:#dc2626;font-weight:800;font-size:.84rem;cursor:pointer;font-family:inherit;transition:background .15s}
.acct-logout:hover{background:#fee2e2}
html[data-theme=dark] .acct-logout{background:#331a1f;border-color:#7f1d1d;color:#fca5a5}
.acct-main{min-width:0;display:flex;flex-direction:column;gap:18px}
.acct-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px}
.acct-head h1{font-size:1.5rem;font-weight:900;line-height:1.6}
.acct-head p{font-size:.82rem;color:var(--muted);margin-top:2px}
.acct-card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px}
.acct-card h2{font-size:1rem;font-weight:800;margin-bottom:12px}
.acct-card h2 small{font-weight:600;font-size:.75rem;color:var(--muted);margin-inline-start:6px}
.acct-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.acct-stat{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px 18px;display:flex;flex-direction:column;justify-content:space-between;gap:10px;min-height:92px}
.acct-stat span{display:block;font-size:.72rem;color:var(--muted);margin-bottom:0;line-height:1.9}
.acct-stat b{font-size:1.18rem;font-weight:900;line-height:1.6}
.acct-stat em{font-style:normal;font-size:.68rem;color:var(--muted);margin-inline-start:8px}
.acct-trip{position:relative;overflow:hidden;border-radius:22px;border:1px solid var(--line);background:var(--surface);display:grid;grid-template-columns:230px minmax(0,1fr);min-height:190px}
.acct-trip-img{width:100%;height:100%;object-fit:cover;display:block}
.acct-trip-body{padding:18px 20px;display:flex;flex-direction:column;gap:12px;justify-content:center}
.acct-trip-body h3{font-size:1.1rem;font-weight:900;line-height:1.6}
.acct-meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;font-size:.8rem;color:var(--muted)}
.acct-meta b{color:var(--ink);font-weight:800}
.acct-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}
.acct-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:12px;padding:10px 16px;font-size:.8rem;font-weight:800;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;font-family:inherit;text-decoration:none;transition:background .15s,border-color .15s,color .15s}
.acct-btn:hover{border-color:var(--accent);color:var(--accent)}
.acct-btn.primary{background:#ff5c5c;border-color:#ff5c5c;color:#fff;box-shadow:0 6px 16px rgba(255,92,92,.25)}
.acct-btn.primary:hover{background:#ef4444;border-color:#ef4444;color:#fff}
html[data-theme=dark] .acct-btn.primary{background:#be3648;border-color:#be3648}
.acct-btn.ghost{background:transparent}
.acct-btn:disabled{opacity:.55;cursor:not-allowed}
.acct-chips{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.acct-chips>*{flex:0 0 auto}
.acct-chips button,.acct-chips .chip{display:inline-flex;align-items:center;justify-content:center;min-height:32px;height:auto;padding:6px 13px;font-size:.74rem;font-weight:800;line-height:1.6;border-radius:999px;margin-inline-start:0;white-space:nowrap;border:1px solid transparent;cursor:pointer;font-family:inherit}
.acct-chips button{background:var(--soft);color:var(--muted);border:1px solid transparent;cursor:pointer;font-family:inherit}
.acct-chips button[aria-pressed=true]{background:#182338;color:#fff}
html[data-theme=dark] .acct-chips button[aria-pressed=true]{background:var(--accent);color:#16202c}
.bk-card{display:grid;grid-template-columns:150px minmax(0,1fr);gap:18px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px}
.bk-card+.bk-card{margin-top:10px}
.bk-card.slim{grid-template-columns:84px minmax(0,1fr);gap:12px;align-items:center}
.bk-card.slim .bk-thumb{height:84px;min-height:0;max-height:none;border-radius:12px}
.bk-card.slim .bk-top b{font-size:.86rem}
.bk-thumb{width:100%;height:100%;min-height:124px;max-height:150px;object-fit:cover;border-radius:13px;display:block}
.bk-body{display:flex;flex-direction:column;gap:10px;min-width:0}
.bk-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.bk-top b{font-size:.95rem;font-weight:800;line-height:1.8}
.bk-code{font-size:.68rem;color:var(--muted);direction:ltr;text-align:right}
.bk-detail{border-top:1px dashed var(--line);padding-top:9px;margin-top:2px;display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px 14px;font-size:.76rem}
.bk-detail div span{display:block;color:var(--muted);font-size:.68rem;margin-bottom:2px}
.bk-detail div b{font-weight:800}
.acct-empty{text-align:center;padding:34px 16px;color:var(--muted);font-size:.85rem}
.acct-empty .glyph{font-size:28px;display:block;margin-bottom:8px}
.fav-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.fav-card{position:relative;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--surface)}
.fav-card img{width:100%;height:130px;object-fit:cover;display:block}
.fav-card .fav-body{padding:10px 12px}
.fav-card h3{font-size:.82rem;font-weight:800;line-height:1.7;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:38px}
.fav-card p{font-size:.72rem;color:var(--muted);margin-top:4px}
.fav-card .fav-del{position:absolute;top:8px;left:8px;width:32px;height:32px;border-radius:50%;background:#fff;color:#ff5c5c;display:grid;place-items:center;border:none;cursor:pointer;box-shadow:0 4px 12px #0003}
.fav-card .fav-del svg{width:16px;height:16px}
.acct-field{display:flex;flex-direction:column;gap:5px;margin-bottom:10px}
.acct-field label{font-size:.76rem;font-weight:700;color:var(--muted)}
.acct-field input,.acct-field textarea,.acct-field select{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 13px;font-size:.84rem;font-family:inherit;background:var(--surface);color:var(--ink)}
.acct-field input:focus,.acct-field textarea:focus{outline:2px solid #ff5c5c33;border-color:#ff5c5c}
.acct-field input:disabled{background:var(--soft);color:var(--muted)}
.acct-hint{font-size:.72rem;color:var(--muted);line-height:1.9}
.acct-msg{font-size:.78rem;margin-top:8px;font-weight:700}
.acct-msg.ok{color:#16a34a}
.acct-msg.err{color:#dc2626}
.acct-note{display:flex;gap:10px;align-items:flex-start;border-radius:14px;padding:11px 13px;font-size:.76rem;line-height:1.9;background:var(--soft);color:var(--muted);border:1px solid var(--line)}
.acct-note.warn{background:#fffbeb;border-color:#fde68a;color:#92400e}

.acct-note.ok{background:#ecfdf5;border-color:#a7f3d0;color:#065f46}
html[data-theme=dark] .acct-note.ok{background:#0f3320;border-color:#166534;color:#6ee7b7}
.stars{display:flex;gap:4px;direction:ltr}
.stars button{background:none;border:none;font-size:22px;line-height:1;cursor:pointer;color:#cbd5e1;padding:0}
.stars button[aria-pressed=true]{color:#f59e0b}
.faq{border:1px solid var(--line);border-radius:14px;margin-bottom:8px;overflow:hidden;background:var(--surface)}
.faq summary{padding:12px 14px;font-size:.82rem;font-weight:800;cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:10px;align-items:center}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";color:var(--accent);font-weight:900}
.faq[open] summary::after{content:"–"}
.faq p{padding:0 14px 13px;font-size:.78rem;color:var(--muted);line-height:2}
.ticket{border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:9px;background:var(--surface)}
.ticket-head{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:.82rem;font-weight:800}
.ticket p{font-size:.78rem;color:var(--muted);line-height:2;margin-top:6px;white-space:pre-wrap}
.ticket .reply{margin-top:9px;border-radius:11px;background:var(--soft);padding:10px 12px;font-size:.78rem;line-height:2}
.acct-skeleton{height:70vh;border-radius:22px;background:var(--soft);animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:.9}}
@media(max-width:1023px){
  .acct-wrap{grid-template-columns:1fr}

  .acct-logout{margin-top:12px;padding:11px}
  .acct-head{align-items:stretch;gap:12px}
  .acct-head .acct-actions{width:100%;justify-content:stretch}
  .acct-head .acct-actions .acct-btn{width:100%;justify-content:center}
  .acct-empty{padding:24px 12px}
  .acct-card h2{margin-bottom:10px}
  .acct-stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .acct-trip{grid-template-columns:1fr}
  .acct-trip-img{height:170px}
  .acct-trip-body{padding:14px 16px}
  .bk-card{grid-template-columns:1fr}
  .bk-thumb{height:160px;max-height:none}
  .acct-head h1{font-size:1.25rem}
}
@media(max-width:420px){.acct-card{padding:14px}.acct-meta{font-size:.75rem}}
@media(max-width:359px){.acct-stats{grid-template-columns:1fr;gap:10px}.acct-stat{min-height:0;padding:14px 16px;gap:6px}.acct-stat b{font-size:1.08rem}.acct-stat span{font-size:.7rem}.acct-card{border-radius:16px}.acct-trip-body{padding:14px;gap:10px}.acct-chips{gap:8px}.acct-actions{gap:8px}.acct-btn{padding:9px 12px;font-size:.76rem}.acct-head h1{font-size:1.1rem}.acct-trip-body h3{font-size:1rem}}
