<!doctype html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مقصدهای محبوب | آلونک</title><meta name="description" content="اقامتگاه‌های منتخب در مقصدهای محبوب ایران"><script src="https://cdn.tailwindcss.com"></script><script>tailwind.config={theme:{extend:{fontFamily:{sans:['Vazirmatn','Tahoma']},colors:{ink:'#182338',coral:'#ff5c5c',sand:'#fff8f3'}}}}</script><link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"><style>
body{font-family:Vazirmatn,Tahoma,sans-serif;color:#182338}
.line-clamp-2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
/* --- stay cards: identical to the homepage «محبوب‌ترین اقامتگاه‌ها» grid --- */
#destinationCards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;align-items:start}
#destinationCards article{min-width:0;display:block;cursor:pointer}
#destinationCards article .relative{height:210px}
#destinationCards article h3{font-size:.95rem;line-height:1.8;margin:0}
#destinationCards article img{transition:transform .5s}
.favorite-button{display:grid;place-items:center;color:#475569;transition:color .2s,transform .2s}
.favorite-button svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.favorite-button[aria-pressed="true"]{color:#f43f5e}
.favorite-button[aria-pressed="true"] svg{fill:currentColor}
.favorite-button:hover{transform:scale(1.08)}
.favorite-button:focus-visible{outline:3px solid #ff5c5c;outline-offset:3px}
html[data-theme=dark] #destinationCards article{background:var(--surface);border-radius:18px;padding:8px;box-shadow:0 0 0 1px var(--line)}
html[data-theme=dark] #destinationCards article>.pt-4{padding:12px 6px 6px}
@media(max-width:767px){
  #destinationCards{gap:12px}
  #destinationCards article .relative{height:140px!important}
  #destinationCards article h3{font-size:.8rem;line-height:1.8;min-height:46px!important}
  #destinationCards article>.pt-4{padding-top:10px}
  #destinationCards article p{font-size:.72rem!important;line-height:1.8!important}
  #destinationCards article .text-sm.whitespace-nowrap{font-size:.68rem}
  #destinationCards .favorite-button{width:36px;height:36px;top:8px;left:8px}
  #destinationCards article .mt-3{margin-top:6px}
}
@media(min-width:1024px){
  #destinationCards{grid-template-columns:repeat(5,minmax(0,1fr));gap:20px 16px}
  #destinationCards article .relative{height:160px!important}
  #destinationCards article>.pt-4{padding-top:12px}
  #destinationCards article h3{font-size:.85rem;line-height:1.8;min-height:48px!important}
  #destinationCards article p{font-size:.75rem}
  #destinationCards article .text-sm.whitespace-nowrap{font-size:.72rem}
  #destinationCards article .mt-3{margin-top:8px}
}
/* --- pager: same as homepage --- */
.stay-pagination{display:flex;flex-direction:column;justify-content:center;align-items:center;gap:8px;margin-top:32px;font-size:13px}
.stay-pagination .pager-row{display:flex;justify-content:center;align-items:center;gap:12px;flex-wrap:nowrap}
.stay-pagination .pager-page{white-space:nowrap;font-weight:700}
.stay-pagination .pager-count{color:#64748b;font-size:12px;white-space:nowrap}
.stay-pagination .pager-arrow{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;line-height:1;color:#e4573d}
.stay-pagination .pager-arrow svg{width:100%;height:100%}
.stay-pagination #staysNext .pager-arrow{color:#22c55e}
.stay-pagination[hidden]{display:none}
.stay-pagination button{background:var(--surface,#fff);border:1px solid var(--line,#e2e8f0);border-radius:12px;padding:10px 16px;font-weight:700;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;cursor:pointer}
.stay-pagination button:disabled{opacity:.35;cursor:not-allowed}
/* --- shared header (same as stay.html) --- */
header nav{position:relative}
header nav>a:first-child{order:0}
.theme-control{order:3;margin-inline-start:10px}
.nav-back{order:2;margin-inline-start:auto;display:inline-flex;align-items:center;gap:7px;border:1px solid #e2e8f0;background:#fff;border-radius:12px;padding:9px 14px;font-size:.82rem;font-weight:700;color:#475569;line-height:1;white-space:nowrap;transition:border-color .15s,color .15s}
.nav-back:hover{border-color:#ff5c5c;color:#ff5c5c}
.nav-back-icon{display:inline-flex;align-items:center;justify-content:center;flex:0 0 22px;width:22px;height:22px;color:#ff5c5c}
.nav-back-icon svg{width:100%;height:100%}
.nav-account{position:absolute;left:50%;transform:translateX(-50%);display:inline-flex;align-items:center;gap:8px;background:#ff5c5c;color:#fff;border:1px solid #ff5c5c;border-radius:14px;padding:11px 18px;font-weight:800;font-size:.85rem;line-height:1;box-shadow:0 6px 18px rgba(255,92,92,.28);cursor:pointer;white-space:nowrap;transition:background .15s,box-shadow .15s}
.nav-account:hover{background:#ef4444;box-shadow:0 8px 22px rgba(255,92,92,.35)}
.nav-account:focus-visible{outline:3px solid #ff5c5c;outline-offset:3px}
.nav-account-icon{display:inline-flex;width:18px;height:18px}
.nav-account-icon svg{width:100%;height:100%}
.login-label{display:inline-block;max-width:26ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:middle}
html[data-theme=dark] .nav-back{background:var(--surface);border-color:var(--line);color:var(--ink)}
@media(min-width:1024px){.login-label{max-width:34ch}}
@media(max-width:360px){.nav-account{position:static!important;transform:none!important;margin-inline:auto!important;order:2}.nav-back{order:3}}
@media(max-width:420px){header nav{gap:4px}header nav>a:first-child{font-size:1.15rem}.nav-account{font-size:.7rem;padding:8px 10px;gap:5px}.nav-account-icon{width:14px;height:14px}.login-label{max-width:14ch}.theme-trigger{width:32px!important;height:32px!important}}
@media(max-width:767px){header nav{gap:6px}.nav-back{padding:9px 10px}.nav-back-text{display:none}.nav-account{padding:10px 12px;font-size:.78rem;gap:6px}.nav-account-icon{width:16px;height:16px}.login-label{max-width:18ch}header nav>a:first-child{font-size:1.3rem}}
</style><meta name="theme-color" content="#ffffff"><link rel="stylesheet" href="assets/theme.css?v=21"><script src="assets/theme.js?v=4"></script></head><body class="bg-white"><header class="border-b border-slate-100 sticky top-0 bg-white/95 backdrop-blur z-10"><nav class="max-w-7xl mx-auto px-5 lg:px-8 h-20 flex items-center justify-between"><a href="index.html" class="font-black text-2xl whitespace-nowrap">آلونک<span class="text-coral">.</span></a><a href="index.html" class="nav-back" aria-label="بازگشت به صفحه اصلی"><span class="nav-back-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M17.6 18.9A8.4 8.4 0 1 0 6.9 19.4"/><path d="m3.2 14.8 3.4 4.7 4.8-2.2"/></svg></span><span class="nav-back-text">بازگشت به صفحه اصلی</span></a><button id="loginBtn" type="button" class="nav-account"><span class="nav-account-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.6"/><path d="M4.5 20a7.5 7.5 0 0 1 15 0"/></svg></span><span class="login-label">ورود / ثبت‌نام</span></button></nav></header><main class="max-w-7xl mx-auto px-5 lg:px-8 py-12"><div class="mb-9"><p class="text-coral font-bold text-sm mb-2">برای سفر بعدی</p><h1 class="text-3xl md:text-4xl font-black">اقامتگاه‌های مقصدهای محبوب</h1><p class="text-slate-500 mt-3">از شمال ایران تا کویر و جزیره؛ اقامتگاه مناسب سفرتان را انتخاب کنید.</p></div><div class="flex flex-wrap gap-2 mb-8" id="filters"></div><div id="destinationCards"></div><div id="stayPagination" class="stay-pagination" hidden></div></main><div id="modal" class="fixed inset-0 z-50 hidden items-center justify-center p-5 bg-ink/60"><div class="bg-white rounded-3xl p-7 w-full max-w-md relative"></div></div><div id="toast" class="fixed bottom-6 right-6 z-[60] hidden bg-ink text-white px-5 py-4 rounded-2xl shadow-2xl text-sm"></div><script src="assets/catalog.js?v=1871"></script><script src="assets/auth.js?v=11"></script><script>
const stays=window.MAKANAK_STAYS;
const root=document.querySelector('#destinationCards');
const pager=document.querySelector('#stayPagination');
const params=new URLSearchParams(location.search);
let city=params.get('city')||'';
let page=1;
const perPage=10;
const arrowRight='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>';
const arrowLeft='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5 8 12l7 7"/></svg>';
const favoriteIcon='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78L12 21.23l8.84-8.84a5.5 5.5 0 0 0 0-7.78Z"/></svg>';
function toPersianDigits(v){return String(v).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d])}
function readFavorites(){try{return JSON.parse(localStorage.getItem('makanak_favorites')||'[]')}catch{return []}}
function isFavorite(i){return readFavorites().includes(i)}
function toggleFavorite(i,el){let f=readFavorites();const selected=!f.includes(i);f=selected?[...f,i]:f.filter(x=>x!==i);localStorage.setItem('makanak_favorites',JSON.stringify(f));el.setAttribute('aria-pressed',String(selected));el.setAttribute('aria-label',(selected?'حذف از':'افزودن به')+' علاقه‌مندی‌ها: '+stays[i].name);toast(selected?'به علاقه‌مندی‌ها اضافه شد':'از علاقه‌مندی‌ها حذف شد')}
function toast(t){const e=document.querySelector('#toast');e.textContent=t;e.classList.remove('hidden');clearTimeout(window.__toastTimer);window.__toastTimer=setTimeout(()=>e.classList.add('hidden'),2500)}
const counts=stays.reduce((o,s)=>(o[s.cityName]=(o[s.cityName]||0)+1,o),{});
const filterBox=document.querySelector('#filters');
const filterClasses='rounded-full px-5 py-2.5 text-sm font-bold whitespace-nowrap cursor-pointer';
function buildFilters(){
  filterBox.innerHTML=`<button type="button" data-city="" class="${filterClasses}">همه (${toPersianDigits(stays.length)})</button>`+Object.entries(counts).map(([c,n])=>`<button type="button" data-city="${c}" class="${filterClasses}">${c} (${toPersianDigits(n)})</button>`).join('');
  filterBox.querySelectorAll('button').forEach(b=>{b.onclick=()=>{city=b.dataset.city;page=1;render()}});
}
function paintFilters(){
  filterBox.querySelectorAll('button').forEach(b=>{
    const active=b.dataset.city===city;
    b.className=filterClasses+(active?' bg-ink text-white':' bg-slate-100');
  });
}
function cardTemplate(s){
  const i=stays.indexOf(s),fav=isFavorite(i);
  return `<article class="group" tabindex="0" role="link" aria-label="${s.name}" onclick="location.href='stay.html?id=${s.id}'" onkeydown="if(event.key==='Enter')location.href='stay.html?id=${s.id}'"><div class="relative rounded-2xl overflow-hidden"><img src="${s.img}" alt="${s.name}" loading="lazy" class="w-full h-full object-cover group-hover:scale-105"><button type="button" aria-label="${fav?'حذف از':'افزودن به'} علاقه‌مندی‌ها: ${s.name}" aria-pressed="${fav}" onclick="event.stopPropagation();toggleFavorite(${i},this)" onkeydown="event.stopPropagation()" class="favorite-button absolute top-3 left-3 w-10 h-10 rounded-full bg-white/90">${favoriteIcon}</button></div><div class="pt-4"><div class="flex justify-between gap-2"><h3 class="font-bold line-clamp-2 leading-7">${s.name}</h3><span class="text-sm whitespace-nowrap">★ ${s.rating}</span></div><p class="text-sm text-slate-500 mt-1">${s.city}</p><p class="mt-3 text-sm"><b>${s.price} تومان</b> <span class="text-slate-400">/ هر شب</span></p></div></article>`;
}
function render(){
  const list=stays.filter(s=>!city||s.cityName===city);
  document.querySelector('h1').textContent=(city||'همه مقصدها')+' · '+toPersianDigits(list.length)+' اقامتگاه در آلونک';
  const pages=Math.max(1,Math.ceil(list.length/perPage));
  page=Math.min(page,pages);
  const visible=list.slice((page-1)*perPage,page*perPage);
  root.innerHTML=visible.map(cardTemplate).join('')||`<p class="text-slate-500 col-span-full">هنوز اقامتگاهی برای این مقصد در فهرست آلونک وارد نشده است.</p>`;
  paintFilters();
  pager.hidden=list.length<=perPage;
  if(pager.hidden){pager.innerHTML='';return}
  pager.innerHTML=`<div class="pager-row"><button type="button" id="staysPrev" ${page===1?'disabled':''}><span class="pager-arrow pager-arrow-prev" aria-hidden="true">${arrowRight}</span><span>قبلی</span></button><span class="pager-page">صفحه ${toPersianDigits(page)} از ${toPersianDigits(pages)}</span><button type="button" id="staysNext" ${page===pages?'disabled':''}><span>بعدی</span><span class="pager-arrow pager-arrow-next" aria-hidden="true">${arrowLeft}</span></button></div><div class="pager-count">${toPersianDigits(list.length)} اقامتگاه</div>`;
  pager.querySelector('#staysPrev').onclick=()=>{page-=1;render();document.querySelector('main').scrollIntoView({behavior:'smooth',block:'start'})};
  pager.querySelector('#staysNext').onclick=()=>{page+=1;render();document.querySelector('main').scrollIntoView({behavior:'smooth',block:'start'})};
}
buildFilters();
render();
</script></body></html>
